<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">Bangkok Travel Icon</title>
  <desc id="desc">Rounded square with the letters BKK on a red background.</desc>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A6A" />
      <stop offset="100%" stop-color="#FF2442" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="176" height="176" rx="36" fill="url(#grad)" />
  <text x="50%" y="58%" text-anchor="middle" font-family="'Noto Sans TC', 'Inter', sans-serif" font-weight="800" font-size="72" fill="#FFFFFF" letter-spacing="2">
    BKK
  </text>
</svg>
