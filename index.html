<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F2F2F7" />
  <title>曼谷家庭旅遊</title>

  <!-- iOS System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // iOS System Colors
            ios: {
              bg: "#F2F2F7",
              card: "#FFFFFF",
              blue: "#007AFF",
              green: "#34C759",
              red: "#FF3B30",
              orange: "#FF9500",
              purple: "#AF52DE",
              pink: "#FF2D55",
              gray: "#8E8E93",
              gray2: "#AEAEB2",
              gray3: "#C7C7CC",
              gray4: "#D1D1D6",
              gray5: "#E5E5EA",
              gray6: "#F2F2F7",
            },
          },
          fontFamily: {
            system: ["-apple-system", "BlinkMacSystemFont", "SF Pro Display", "Noto Sans TC", "Helvetica Neue", "Arial", "sans-serif"],
          },
          fontSize: {
            // iOS Typography (Apple HIG)
            'ios-largeTitle': ['34px', { lineHeight: '41px', fontWeight: '700', letterSpacing: '0.37px' }],
            'ios-title1': ['28px', { lineHeight: '34px', fontWeight: '700' }],
            'ios-title2': ['22px', { lineHeight: '28px', fontWeight: '700' }],
            'ios-title3': ['20px', { lineHeight: '25px', fontWeight: '600' }],
            'ios-headline': ['17px', { lineHeight: '22px', fontWeight: '600' }],
            'ios-body': ['17px', { lineHeight: '22px', fontWeight: '400' }],
            'ios-callout': ['16px', { lineHeight: '21px', fontWeight: '400' }],
            'ios-subhead': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ios-footnote': ['13px', { lineHeight: '18px', fontWeight: '400' }],
            'ios-caption1': ['12px', { lineHeight: '16px', fontWeight: '400' }],
            'ios-caption2': ['11px', { lineHeight: '13px', fontWeight: '400' }],
          },
          borderRadius: {
            'ios': '10px',
            'ios-lg': '14px',
            'ios-xl': '20px',
            'ios-2xl': '24px',
          },
          boxShadow: {
            'ios': '0 2px 8px rgba(0, 0, 0, 0.08)',
            'ios-md': '0 4px 16px rgba(0, 0, 0, 0.08)',
            'ios-lg': '0 8px 24px rgba(0, 0, 0, 0.12)',
          },
          spacing: {
            // iOS Spacing System (multiples of 4)
            'ios-xs': '4px',
            'ios-sm': '8px',
            'ios-md': '12px',
            'ios-lg': '16px',
            'ios-xl': '20px',
            'ios-2xl': '24px',
            'ios-3xl': '32px',
            'ios-4xl': '40px',
            'safe-bottom': 'calc(env(safe-area-inset-bottom, 0px) + 100px)',
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      background: #F2F2F7;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* iOS Glass Effect */
    .ios-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    /* iOS Card Style */
    .ios-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* iOS List Style (Grouped) */
    .ios-list {
      background: white;
      border-radius: 14px;
      overflow: hidden;
    }

    .ios-list-item {
      padding: 14px 16px;
      border-bottom: 0.5px solid rgba(60, 60, 67, 0.12);
    }

    .ios-list-item:last-child {
      border-bottom: none;
    }

    /* Hide scrollbar but keep functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* iOS Momentum Scroll */
    .scroll-momentum {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* Material Symbols */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .material-symbols-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Safe areas */
    .safe-top {
      padding-top: max(var(--safe-top), 20px);
    }

    .safe-bottom {
      padding-bottom: max(var(--safe-bottom), 34px);
    }

    .pb-safe {
      padding-bottom: calc(var(--safe-bottom) + 100px) !important;
    }

    /* iOS Section Header */
    .ios-section-header {
      font-size: 13px;
      font-weight: 400;
      color: #6D6D72;
      text-transform: uppercase;
      letter-spacing: -0.08px;
      padding: 8px 16px 6px;
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #E5E5EA 25%, #F2F2F7 50%, #E5E5EA 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --bg-secondary: #1C1C1E;
        --bg-tertiary: #2C2C2E;
        --text: #FFFFFF;
        --text-secondary: #EBEBF5;
      }

      html,
      body {
        background: #000000;
        color: #FFFFFF;
      }

      .ios-glass {
        background: rgba(28, 28, 30, 0.72);
      }

      .ios-card,
      .ios-list {
        background: #1C1C1E;
      }

      .ios-list-item {
        border-color: rgba(84, 84, 88, 0.65);
      }

      .skeleton {
        background: linear-gradient(90deg, #2C2C2E 25%, #3A3A3C 50%, #2C2C2E 75%);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
