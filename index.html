<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F2F2F7" />
  <title>曼谷家庭旅遊</title>

  <!-- System Fonts + Noto Sans TC for Chinese -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // iOS System Colors
            ios: {
              bg: "#F2F2F7",
              secondaryBg: "#FFFFFF",
              tertiaryBg: "#F2F2F7",
              groupedBg: "#F2F2F7",
              separator: "rgba(60, 60, 67, 0.12)",
              opaqueSeparator: "#C6C6C8",
              label: "#000000",
              secondaryLabel: "rgba(60, 60, 67, 0.6)",
              tertiaryLabel: "rgba(60, 60, 67, 0.3)",
              quaternaryLabel: "rgba(60, 60, 67, 0.18)",
              // Accent Colors
              blue: "#007AFF",
              green: "#34C759",
              indigo: "#5856D6",
              orange: "#FF9500",
              pink: "#FF2D55",
              purple: "#AF52DE",
              red: "#FF3B30",
              teal: "#5AC8FA",
              yellow: "#FFCC00",
              // Gray Scale
              gray: "#8E8E93",
              gray2: "#AEAEB2",
              gray3: "#C7C7CC",
              gray4: "#D1D1D6",
              gray5: "#E5E5EA",
              gray6: "#F2F2F7",
            },
          },
          fontFamily: {
            // iOS System Font Stack
            system: ["-apple-system", "BlinkMacSystemFont", "SF Pro Display", "SF Pro Text", "Noto Sans TC", "Helvetica Neue", "Arial", "sans-serif"],
          },
          fontSize: {
            // iOS Typography Scale (Apple HIG)
            'ios-largeTitle': ['34px', { lineHeight: '41px', fontWeight: '700', letterSpacing: '-0.02em' }],
            'ios-title1': ['28px', { lineHeight: '34px', fontWeight: '700', letterSpacing: '-0.02em' }],
            'ios-title2': ['22px', { lineHeight: '28px', fontWeight: '700', letterSpacing: '-0.02em' }],
            'ios-title3': ['20px', { lineHeight: '25px', fontWeight: '600' }],
            'ios-headline': ['17px', { lineHeight: '22px', fontWeight: '600' }],
            'ios-body': ['17px', { lineHeight: '22px', fontWeight: '400' }],
            'ios-callout': ['16px', { lineHeight: '21px', fontWeight: '400' }],
            'ios-subheadline': ['15px', { lineHeight: '20px', fontWeight: '400' }],
            'ios-footnote': ['13px', { lineHeight: '18px', fontWeight: '400' }],
            'ios-caption1': ['12px', { lineHeight: '16px', fontWeight: '400' }],
            'ios-caption2': ['11px', { lineHeight: '13px', fontWeight: '400' }],
          },
          borderRadius: {
            // iOS Continuous Corners
            'ios-sm': '10px',
            'ios': '12px',
            'ios-md': '16px',
            'ios-lg': '22px',
            'ios-xl': '28px',
            'ios-2xl': '38px',
          },
          boxShadow: {
            // iOS Shadow System
            'ios-sm': '0 1px 3px rgba(0, 0, 0, 0.06)',
            'ios': '0 4px 12px rgba(0, 0, 0, 0.08)',
            'ios-md': '0 8px 24px rgba(0, 0, 0, 0.08)',
            'ios-lg': '0 12px 40px rgba(0, 0, 0, 0.12)',
            'ios-card': '0 2px 8px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.08)',
          },
          animation: {
            'ios-spring': 'iosSpring 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'ios-fade': 'iosFade 0.3s ease-out',
          },
          keyframes: {
            iosSpring: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            iosFade: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html {
      scroll-behavior: smooth;
      background: #F2F2F7;
      /* Enable momentum scrolling */
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      background: #F2F2F7;
      color: #000000;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      margin: 0;
      padding: 0;
      /* iOS Font Smoothing */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Allow text selection in inputs */
    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /* iOS Momentum Scrolling */
    .scroll-momentum {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: auto;
    }

    /* Hide scrollbars but keep functionality */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Material Symbols - iOS style weight */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

    .material-symbols-filled {
      font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }

    /* Safe Area Insets */
    .safe-area-top {
      padding-top: max(var(--safe-top), 20px);
    }

    .safe-area-bottom {
      padding-bottom: max(var(--safe-bottom), 34px);
    }

    .safe-area-app {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .pb-safe {
      padding-bottom: calc(var(--safe-bottom) + 16px) !important;
    }

    /* iOS Glassmorphism */
    .ios-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .ios-glass-dark {
      background: rgba(30, 30, 30, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    /* iOS Card Style */
    .ios-card {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* iOS List Separator */
    .ios-separator {
      height: 0.5px;
      background: rgba(60, 60, 67, 0.12);
      margin-left: 16px;
    }

    /* iOS Press Effect */
    .ios-press {
      transition: transform 0.1s ease-out, opacity 0.1s ease-out;
    }

    .ios-press:active {
      transform: scale(0.96);
      opacity: 0.7;
    }

    /* Continuous Corner Radius (like iOS) */
    .continuous-corners {
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      mask-image: radial-gradient(white, black);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
