<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FF2442" />
  <title>曼谷探險</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="曼谷探險" />

  <!-- Fonts: System + Noto Sans TC + Roboto Condensed for time display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Material Symbols - Both Outlined and Rounded (for filled effect) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0;
    }

    .material-symbols-filled {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1;
    }
  </style>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Xiaohongshu / Magazine Color Palette
            red: {
              xhs: "#FF2442", // Xiaohongshu signature red
              light: "#FFE8EB",
            },
            charcoal: "#333333",
            stone: "#8E8E93",
            cream: "#FAFAFA",
            sand: "#F5F5DC",
            mist: "#E0F7FA",
            // Pastel accents
            pastel: {
              blue: "#E3F2FD",
              pink: "#FCE4EC",
              mint: "#E8F5E9",
              peach: "#FFF3E0",
              lavender: "#F3E5F5",
            }
          },
          fontFamily: {
            sans: ["Noto Sans TC", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            mono: ["Roboto Condensed", "SF Mono", "monospace"],
          },
          fontSize: {
            // Magazine typography
            'mag-hero': ['28px', { lineHeight: '1.2', fontWeight: '700', letterSpacing: '-0.02em' }],
            'mag-title': ['18px', { lineHeight: '1.4', fontWeight: '600' }],
            'mag-body': ['15px', { lineHeight: '1.6', fontWeight: '400' }],
            'mag-caption': ['13px', { lineHeight: '1.5', fontWeight: '400' }],
            'mag-badge': ['11px', { lineHeight: '1', fontWeight: '600' }],
            'mag-time': ['12px', { lineHeight: '1', fontWeight: '600', letterSpacing: '0.05em' }],
          },
          borderRadius: {
            'mag': '16px',
            'mag-lg': '20px',
            'mag-xl': '24px',
            'pill': '100px',
          },
          boxShadow: {
            // Soft magazine shadows - no harsh borders
            'mag': '0px 10px 40px -10px rgba(0, 0, 0, 0.08)',
            'mag-hover': '0px 20px 50px -15px rgba(0, 0, 0, 0.12)',
            'glass': '0 4px 30px rgba(0, 0, 0, 0.05)',
          },
          animation: {
            'heart-pop': 'heartPop 0.4s cubic-bezier(0.17, 0.67, 0.35, 1.5)',
            'float': 'float 6s ease-in-out infinite',
            'shimmer': 'shimmer 2s infinite',
          },
          keyframes: {
            heartPop: {
              '0%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.4)' },
              '100%': { transform: 'scale(1)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html,
    body {
      background: #FAFAFA;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      color: #333333;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      overflow-x: hidden;
    }

    /* Mesh Gradient Background Orbs */
    .mesh-gradient {
      position: fixed;
      pointer-events: none;
      z-index: -1;
    }

    .mesh-orb-1 {
      top: -10%;
      left: -20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(224, 247, 250, 0.8) 0%, transparent 70%);
      filter: blur(80px);
      animation: float 8s ease-in-out infinite;
    }

    .mesh-orb-2 {
      bottom: -10%;
      right: -20%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(245, 245, 220, 0.7) 0%, transparent 70%);
      filter: blur(80px);
      animation: float 10s ease-in-out infinite reverse;
    }

    .mesh-orb-3 {
      top: 40%;
      right: -10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(252, 228, 236, 0.5) 0%, transparent 70%);
      filter: blur(60px);
      animation: float 12s ease-in-out infinite;
    }

    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }

    .glass-strong {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
    }

    /* Image overlay gradient */
    .img-overlay {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.2) 40%, transparent 100%);
    }

    /* Skeleton Loading */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Material Symbols */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .material-symbols-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Dark Mode */
    .dark {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2a2a2a;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
    }

    .dark body {
      background: #1a1a1a;
    }

    .dark .bg-cream {
      background: #1a1a1a !important;
    }

    .dark .bg-white {
      background: #2a2a2a !important;
    }

    .dark .text-charcoal {
      color: #f5f5f5 !important;
    }

    .dark .text-stone {
      color: #888 !important;
    }

    .dark .glass {
      background: rgba(26, 26, 26, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .dark .glass-strong {
      background: rgba(26, 26, 26, 0.95) !important;
    }

    .dark .border-black\/5 {
      border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .dark .shadow-mag {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }

    /* Safe areas */
    .safe-top {
      padding-top: max(var(--safe-top), 12px);
    }

    .safe-bottom {
      padding-bottom: max(var(--safe-bottom), 20px);
    }

    .pb-safe {
      padding-bottom: calc(var(--safe-bottom) + 90px) !important;
    }

    /* Masonry Grid */
    .masonry {
      column-count: 2;
      column-gap: 12px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 12px;
    }

    /* Magazine card text on image */
    .mag-card-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      z-index: 10;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(2deg);
      }
    }

    /* ===== DARK MODE ===== */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1C1C1E;
        --bg-secondary: #2C2C2E;
        --bg-tertiary: #3A3A3C;
        --text-primary: #FFFFFF;
        --text-secondary: #EBEBF5;
        --text-tertiary: #8E8E93;
      }

      html,
      body {
        background: var(--bg-primary);
        color: var(--text-primary);
      }

      /* Dark mesh gradients */
      .mesh-orb-1 {
        background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      }

      .mesh-orb-2 {
        background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, transparent 70%);
      }

      .mesh-orb-3 {
        background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
      }

      /* Dark glassmorphism */
      .glass {
        background: rgba(44, 44, 46, 0.7);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .glass-strong {
        background: rgba(44, 44, 46, 0.9);
      }

      /* Dark skeleton */
      .skeleton {
        background: linear-gradient(90deg, #2C2C2E 25%, #3A3A3C 50%, #2C2C2E 75%);
      }

      /* Override text colors */
      .text-charcoal {
        color: var(--text-primary) !important;
      }

      .text-stone {
        color: var(--text-tertiary) !important;
      }

      .bg-cream {
        background: var(--bg-primary) !important;
      }

      .bg-white {
        background: var(--bg-secondary) !important;
      }

      /* Dark shadows */
      .shadow-mag {
        box-shadow: 0px 10px 40px -10px rgba(0, 0, 0, 0.4);
      }

      /* Dark input styling */
      input,
      textarea {
        color: var(--text-primary);
      }

      input::placeholder,
      textarea::placeholder {
        color: var(--text-tertiary);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>

<body>
  <!-- Mesh Gradient Background -->
  <div class="mesh-gradient mesh-orb-1"></div>
  <div class="mesh-gradient mesh-orb-2"></div>
  <div class="mesh-gradient mesh-orb-3"></div>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA] SW registered:', reg.scope))
          .catch(err => console.log('[PWA] SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
